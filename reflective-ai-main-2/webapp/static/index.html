<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reflexions-Sandbox</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Reflexions-Sandbox</h1>
          <p id="model-label"></p>
        </div>
        <button id="new-conversation" type="button">Neues Gespräch</button>
      </header>

      <section id="setup-panel" class="setup-panel">
        <div class="setup-copy">
          <p class="eyebrow">Bevor das Gespräch beginnt</p>
          <h2>Beantworte diese drei Fragen.</h2>
          <p>
            Dein Thema, deine Position oder Präferenz und wie stark du diese Ansicht
            vertrittst, geben dem Chat genug Kontext für den Start.
          </p>
        </div>
        <form id="setup-form" class="setup-form" novalidate>
          <label>
            <span>Thema</span>
            <input
              id="topic-input"
              name="topic"
              autocomplete="off"
              placeholder="Beispiel: Wohnungspolitik oder Kochen"
              required
            />
          </label>
          <label>
            <span>Ansicht oder Präferenz</span>
            <input
              id="stance-input"
              name="stance"
              autocomplete="off"
              placeholder="Beschreibe kurz deine Ansicht oder was dir gefällt"
              required
            />
          </label>
          <label>
            <span>Wie stark vertrittst du diese Ansicht, oder wie sehr gefällt dir das?</span>
            <input
              id="strength-input"
              name="strength"
              type="number"
              min="0"
              max="100"
              step="1"
              placeholder="0 = gering, 100 = hoch"
              required
            />
          </label>
          <button id="setup-submit" type="submit">Chat starten</button>
        </form>
        <p id="setup-error" class="status error" role="alert"></p>
      </section>

      <section id="chat-panel" class="chat-panel" hidden>
        <div id="context-line" class="context-line"></div>
        <div id="messages" class="messages"></div>
        <div
          id="completion-banner"
          class="completion-banner"
          role="status"
          aria-live="polite"
          hidden
        >
          <strong>Gespräch beendet</strong>
          <span>Danke. Du kannst diese Seite schließen oder ein neues Gespräch starten.</span>
        </div>
        <form id="message-form" class="message-form">
          <input
            id="message-input"
            autocomplete="off"
            placeholder="Antwort eingeben..."
            required
          />
          <button type="submit">Senden</button>
        </form>
        <p id="chat-status" class="status"></p>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
