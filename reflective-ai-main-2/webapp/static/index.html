<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reflective Sandbox</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Reflective Sandbox</h1>
          <p id="model-label"></p>
        </div>
        <button id="new-conversation" type="button">New conversation</button>
      </header>

      <section id="setup-panel" class="setup-panel">
        <div class="setup-copy">
          <p class="eyebrow">Before the conversation starts</p>
          <h2>Answer these three setup questions.</h2>
          <p>
            Your condition, topic, position or preference, and certainty give the
            chat enough context to begin.
          </p>
        </div>
        <form id="setup-form" class="setup-form" novalidate>
          <label>
            <span>Condition</span>
            <select id="condition-input" name="condition" required>
              <option value="treatment">Treatment: reflective political chat</option>
              <option value="control">Control: neutral hobby or interest chat</option>
            </select>
          </label>
          <label>
            <span>Topic</span>
            <input
              id="topic-input"
              name="topic"
              autocomplete="off"
              placeholder="Example: housing policy or cooking"
              required
            />
          </label>
          <label>
            <span>View or preference</span>
            <input
              id="stance-input"
              name="stance"
              autocomplete="off"
              placeholder="Briefly state your view or what you enjoy"
              required
            />
          </label>
          <label>
            <span>How strongly do you hold this view, or how much do you enjoy it?</span>
            <input
              id="strength-input"
              name="strength"
              type="number"
              min="0"
              max="100"
              step="1"
              placeholder="0 = low, 100 = high"
              required
            />
          </label>
          <button id="setup-submit" type="submit">Start chat</button>
        </form>
        <p id="setup-error" class="status error" role="alert"></p>
      </section>

      <section id="chat-panel" class="chat-panel" hidden>
        <div id="context-line" class="context-line"></div>
        <div id="messages" class="messages"></div>
        <div
          id="completion-banner"
          class="completion-banner"
          role="status"
          aria-live="polite"
          hidden
        >
          <strong>Conversation complete</strong>
          <span>Thanks. You can close this page or start a new conversation.</span>
        </div>
        <form id="message-form" class="message-form">
          <input
            id="message-input"
            autocomplete="off"
            placeholder="Type your reply..."
            required
          />
          <button type="submit">Send</button>
        </form>
        <p id="chat-status" class="status"></p>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
